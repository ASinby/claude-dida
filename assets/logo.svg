  <rect x="84" y="70" width="10" height="8" fill="#C1643F"/>

  <!-- feet -->
  <rect x="20" y="89" width="5" height="12" fill="#C1643F"/>
  <rect x="30" y="89" width="5" height="12" fill="#C1643F"/>
  <rect x="60" y="89" width="5" height="12" fill="#C1643F"/>
  <rect x="69" y="89" width="5" height="12" fill="#C1643F"/>

</svg>
