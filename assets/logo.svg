<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="claude-dida logo：一只举着喇叭的小宠物">

  <!-- sound waves -->
  <g fill="none" stroke="#D97757" stroke-width="4" stroke-linecap="round" transform="translate(-15, 0)">
    <path d="M113.4 54.1 A9 9 0 0 1 113.4 67.9"/>
    <path d="M117.6 48.9 A15.5 15.5 0 0 1 117.6 73.1"/>
    <path d="M121.8 43.8 A22 22 0 0 1 121.8 78.2" stroke-opacity="0.5"/>
